<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>촬영 중 - 도보 수집 (가로 모드)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    html { height: 100%; } /* Stitch 출력 보정: body h-full이 0으로 접히는 것 방지 */
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="h-full w-full m-0 p-0 overflow-hidden bg-black select-none font-sans text-white">

  <!-- Full-bleed Camera Viewfinder Background -->
  <div class="relative w-full h-full overflow-hidden flex flex-col justify-between">
    <img 
      src="https://lh3.googleusercontent.com/aida/AEtjO1VpDLGc1gD06oMbm0nOBcfhcB30eP_zxyIreuxzoyk_v2--Qenkw85PN7oW_tBLiD-Kicv51EalUwz67Xa67buhyhvJJicYA6tv2WWnX1qGnGMTOWToN3bC8j8N1Djt_8-Cz1sKVrfWvjMExtHkxpBbO40pUU83XGvsIPeTohrgzUOjzThFR0rCY7zf47olGBUlSGDTlMOVQQh4E0OlsC1yzzTcF7mBFMqSSAMV3JX50ZyDS3QCnOrXGmw" 
      alt="도보 수집 카메라 뷰파인더" 
      class="absolute inset-0 w-full h-full object-cover object-center pointer-events-none"
    />

    <!-- Subtle vignette for legible HUD text without glassmorphism/heavy gradients -->

    <!-- TOP SECTION -->
    <div class="relative z-20 w-full flex flex-col items-center">
      <!-- Top Warning Banner: Thin amber warning banner across the very top -->
      <div class="w-full bg-[#EF9F27] text-[#1C1C1A] text-[13px] font-medium py-1.5 px-4 flex items-center justify-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">warning</span>
        <span>GPS 18m · 이대로 저장하면 반려될 수 있어요. 잠시 멈춰 신호를 기다리세요</span>
      </div>

      <!-- Top HUD Row -->
      <div class="w-full px-5 pt-3 grid grid-cols-3 items-start">
        <div></div>
        <!-- 상단 중앙: 거리(주) + 시간(보조) -->
        <div class="justify-self-center bg-black/70 border border-white/15 px-5 py-1.5 rounded-full flex items-baseline gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-[#E24B4A] self-center"></span>
          <span class="text-[32px] font-medium leading-none tabular-nums text-white">68m</span>
          <span class="text-[14px] font-medium leading-none text-white/60">/ 100m</span>
          <span class="text-[13px] font-medium leading-none text-white/50 tabular-nums ml-1">00:12</span>
        </div>
        <!-- 우상단: GPS -->
        <div class="justify-self-end bg-black/60 border border-white/10 px-2.5 py-1 rounded-full flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-[#EF9F27]"></span>
          <span class="text-xs font-medium text-[#EF9F27]">GPS 18m</span>
        </div>
      </div>
    </div>

    <!-- RIGHT CENTER: Record Stop Button -->
    <div class="absolute right-6 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center gap-1">
      <button 
        type="button" 
        class="w-[72px] h-[72px] rounded-full border-4 border-white flex items-center justify-center bg-black/30 active:scale-95 transition-transform cursor-pointer"
        aria-label="촬영 종료"
      >
        <!-- Red rounded square stop icon inside white ring -->
        <span class="w-7 h-7 bg-[#E24B4A] rounded-[6px]"></span>
      </button>
    </div>

    <!-- BOTTOM LEFT: Minimap Card (about 1/4 screen width) -->
    <div class="relative z-20 p-4">
      <div class="w-[150px] h-[150px] rounded-lg overflow-hidden border border-white/40 bg-[#F2F1EC]">
    <svg class="w-full h-full" viewBox="42 -31 140 140" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="-50" y="-50" width="300" height="200" fill="#F4F3EE"/>
      <path d="M 30 10 L 30 80" stroke="#888780" stroke-width="9" stroke-linecap="round"/>
      <path d="M 175 15 L 175 45" stroke="#888780" stroke-width="9" stroke-linecap="round"/>
      <path d="M 20 75 L 185 75" stroke="#888780" stroke-width="8" stroke-linecap="round"/>
      <path d="M 175 45 L 175 80" stroke="#E24B4A" stroke-width="9" stroke-linecap="round"/>
      <path d="M 30 50 L 70 50" stroke="#97C459" stroke-width="9" stroke-linecap="round"/>
      <path d="M 125 35 L 175 35" stroke="#EF9F27" stroke-width="9" stroke-linecap="round"/>
      <path d="M 70 50 L 100 45 L 125 35" stroke="#888780" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 70 50 L 100 45 L 112 39" stroke="#2B6CB0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="112" cy="39" r="9" fill="#2B6CB0" fill-opacity="0.25"/>
      <circle cx="112" cy="39" r="5" fill="#2B6CB0" stroke="#ffffff" stroke-width="2"/>
    </svg>
  </div>
    </div>

  </div>

</body>
</html>
