<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촬영 종료 확인 - 도보 수집 (가로 모드)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    html { height: 100%; } /* Stitch 출력 보정: body h-full이 0으로 접히는 것 방지 */
    * {
      box-sizing: border-box;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body class="w-full h-full relative overflow-hidden bg-black flex items-center justify-center">

  <!-- Background Camera Feed (Handheld pedestrian eye-level view) -->
  <div class="absolute inset-0 w-full h-full overflow-hidden">
    <img 
      src="https://lh3.googleusercontent.com/aida/AEtjO1VpDLGc1gD06oMbm0nOBcfhcB30eP_zxyIreuxzoyk_v2--Qenkw85PN7oW_tBLiD-Kicv51EalUwz67Xa67buhyhvJJicYA6tv2WWnX1qGnGMTOWToN3bC8j8N1Djt_8-Cz1sKVrfWvjMExtHkxpBbO40pUU83XGvsIPeTohrgzUOjzThFR0rCY7zf47olGBUlSGDTlMOVQQh4E0OlsC1yzzTcF7mBFMqSSAMV3JX50ZyDS3QCnOrXGmw" 
      alt="도보 수집 시점 카메라 뷰" 
      class="w-full h-full object-cover filter blur-[1px]"
    />
    <!-- Dim Overlay -->
    <div class="absolute inset-0 bg-black/65"></div>
  </div>

  <!-- Bottom Sheet Overlay Container -->
  <div class="absolute inset-0 z-30 flex flex-col justify-end items-center pointer-events-none">
    
    <!-- Backdrop dismiss area (if applicable) -->
    <div class="flex-1 w-full pointer-events-auto"></div>

    <div class="w-full max-w-[760px] bg-white rounded-t-2xl px-6 pt-2 pb-4 flex flex-col pointer-events-auto border-t border-x border-[#E3E2DD]">
      <div class="flex justify-center items-center py-0.5 mb-1">
        <div class="w-10 h-1 rounded-full bg-[#D1D1CB]"></div>
      </div>
      <div class="flex gap-5 items-stretch">
        <!-- 좌: 16:9 프리뷰 -->
        <div class="flex-1 min-w-0 flex flex-col gap-2">
          <h2 class="text-[#1C1C1A] text-[17px] font-medium tracking-tight">이 클립을 저장할까요?</h2>
          <div class="relative w-full h-[150px] rounded-lg overflow-hidden bg-[#E3E2DD] border border-black/10">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWw9NUV2HQAX8G36lsDXSP9Y6RqK9v37bDA5FxjdxC8L7rxKjtnUDXnwAoQW0xW3IaW0ga3IHOyG1EAat32jSeoGGBZLXxdp7Bw9goz64fRh6zB1VO_xOVofomsMnGlJrD1t7P9q0o8eAKE-6FMBbYH1iGAkl8IzAznX6W11g741oog3sv-y_dEM1ybECBPK44QoETErO-PD_z_7iRH1WUMG0KErTV1xgljrFCKntHEWlo2MjPStuQt57cePo6UhhtUKx-4pncJ-w" alt="수집 영상 프리뷰" class="w-full h-full object-cover"/>
            <div class="absolute inset-0 bg-black/25 flex items-center justify-center">
              <span class="material-symbols-outlined text-white text-[40px]">play_arrow</span>
            </div>
            <div class="absolute bottom-2 left-2 flex items-center gap-1.5 bg-black/75 text-white text-[12px] font-medium px-2 py-1 rounded">
              <span class="tabular-nums">18초 · 112m</span>
              <span class="text-white/50">·</span>
              <span>성북로 12길</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5 text-[12px] text-[#1C1C1A] bg-[#FEF5E7] border border-[#EF9F27]/50 rounded-md px-2.5 py-1.5">
            <span class="material-symbols-outlined text-[15px] text-[#EF9F27]">warning</span>
            <span>저정확도(GPS 18m) 구간 6초 포함 — 검수에서 반려될 수 있어요</span>
          </div>
        </div>
        <!-- 우: 버튼 3개 (그립 쪽) -->
        <div class="w-[200px] shrink-0 flex flex-col gap-2 justify-end">
          <button type="button" class="w-full h-[52px] bg-[#2B6CB0] text-white font-medium text-[16px] rounded-lg flex items-center justify-center">저장</button>
          <button type="button" class="w-full h-[48px] bg-white border border-[#D1D1CB] text-[#1C1C1A] font-medium text-[15px] rounded-lg flex items-center justify-center">폐기 후 다시 찍기</button>
          <button type="button" class="w-full h-[48px] bg-white border border-[#E24B4A] text-[#E24B4A] font-medium text-[15px] rounded-lg flex items-center justify-center">폐기</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
