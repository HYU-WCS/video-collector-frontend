<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>촬영 대기 - 도보 수집 (가로 모드)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <style>
    html { height: 100%; } /* Stitch 출력 보정: body h-full이 0으로 접히는 것 방지 */
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #000;
    }
  </style>
</head>
<body class="relative w-full h-full overflow-hidden bg-black text-white">

  <!-- Camera Viewfinder Background (Full-bleed Handheld Pedestrian View) -->
  <div class="absolute inset-0 w-full h-full overflow-hidden">
    <img 
      src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWw9NUV2HQAX8G36lsDXSP9Y6RqK9v37bDA5FxjdxC8L7rxKjtnUDXnwAoQW0xW3IaW0ga3IHOyG1EAat32jSeoGGBZLXxdp7Bw9goz64fRh6zB1VO_xOVofomsMnGlJrD1t7P9q0o8eAKE-6FMBbYH1iGAkl8IzAznX6W11g741oog3sv-y_dEM1ybECBPK44QoETErO-PD_z_7iRH1WUMG0KErTV1xgljrFCKntHEWlo2MjPStuQt57cePo6UhhtUKx-4pncJ-w" 
      alt="도보 골목길 카메라 뷰파인더" 
      class="w-full h-full object-cover object-center"
    />
    <!-- Very subtle vignette for field-readability of UI text -->
  </div>

  <!-- 상단 중앙: 거리 (주 정보) -->
  <div class="absolute top-3 left-1/2 -translate-x-1/2 z-20">
    <div class="flex items-baseline gap-1.5 px-5 py-1.5 rounded-full bg-black/75 text-white border border-white/10">
      <span class="text-[32px] font-medium leading-none tabular-nums">0m</span>
      <span class="text-[14px] font-medium text-white/60 leading-none">/ 100m</span>
    </div>
  </div>

  <!-- Top Right: GPS Accuracy Indicator -->
  <div class="absolute top-4 right-6 z-20">
    <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/70 text-white border border-white/10">
      <span class="w-2 h-2 rounded-full bg-[#97C459]"></span>
      <span class="text-[12px] font-medium tracking-tight">GPS 4m</span>
    </div>
  </div>

  <!-- Right Center: Large Circular White Record Button (Hollow ring style) -->
  <div class="absolute right-7 top-1/2 -translate-y-1/2 z-20 flex flex-col items-center">
    <button class="relative w-18 h-18 rounded-full border-4 border-white flex items-center justify-center p-1.5 active:scale-95 transition-transform cursor-pointer bg-transparent focus:outline-none" style="width: 72px; height: 72px;">
      <!-- Inner red circle for recording trigger -->
      <div class="w-full h-full rounded-full bg-[#E24B4A] transition-opacity hover:opacity-90"></div>
    </button>
  </div>

  <!-- 좌하단 미니맵 -->
  <div class="absolute bottom-4 left-6 z-20">
  <div class="w-[150px] h-[150px] rounded-lg overflow-hidden border border-white/40 bg-[#F2F1EC]">
    <svg class="w-full h-full" viewBox="0 -20 140 140" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="-50" y="-50" width="300" height="200" fill="#F4F3EE"/>
      <path d="M 30 10 L 30 80" stroke="#888780" stroke-width="9" stroke-linecap="round"/>
      <path d="M 175 15 L 175 45" stroke="#888780" stroke-width="9" stroke-linecap="round"/>
      <path d="M 20 75 L 185 75" stroke="#888780" stroke-width="8" stroke-linecap="round"/>
      <path d="M 175 45 L 175 80" stroke="#E24B4A" stroke-width="9" stroke-linecap="round"/>
      <path d="M 30 50 L 70 50" stroke="#97C459" stroke-width="9" stroke-linecap="round"/>
      <path d="M 125 35 L 175 35" stroke="#EF9F27" stroke-width="9" stroke-linecap="round"/>
      <path d="M 70 50 L 100 45 L 125 35" stroke="#888780" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="70" cy="50" r="9" fill="#2B6CB0" fill-opacity="0.25"/>
      <circle cx="70" cy="50" r="5" fill="#2B6CB0" stroke="#ffffff" stroke-width="2"/>
    </svg>
  </div>
  </div>


</body>
</html>
